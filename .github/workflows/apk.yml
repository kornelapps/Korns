name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # ---- Motor offline: stable-diffusion.cpp para Android arm64 ----
      - name: Cache del motor sd
        id: cache-sd
        uses: actions/cache@v4
        with:
          path: libsdcli.so
          key: sd-cli-android-arm64-d637cfb-v1

      - name: Compilar stable-diffusion.cpp (arm64)
        if: steps.cache-sd.outputs.cache-hit != 'true'
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          git clone https://github.com/leejet/stable-diffusion.cpp sdcpp
          cd sdcpp
          git checkout d637cfb935feb2254898a8f1524046c958f3df80
          git submodule update --init --depth 1 ggml
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_BUILD_EXAMPLES=ON \
            -DSD_WEBP=OFF -DSD_WEBM=OFF \
            -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16
          cmake --build build-android --target sd-cli -j"$(nproc)"
          BIN="$(find build-android -type f -name sd-cli | head -n1)"
          echo "Binario: $BIN"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" "$BIN"
          cp "$BIN" ../libsdcli.so
          cd ..
          rm -rf sdcpp
          ls -la libsdcli.so

      # ---- App Flutter ----
      - name: Crear proyecto Android y copiar codigo
        run: |
          flutter create --platforms=android --org com.kornelapps --project-name kornels_imagenes tmp_app
          cp -r tmp_app/android ./android
          rm -rf tmp_app
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:largeHeap="true"#' $M
          sed -i 's#android:label="[^"]*"#android:label="Kornels Imagenes"#' $M
          # Actividad con canal para conocer la carpeta de librerias nativas
          ACT="$(find android/app/src/main -name MainActivity.kt | head -n1)"
          cp nativo/MainActivity.kt "$ACT"
          # El motor viaja como libreria nativa (unica forma de ejecutarlo en Android 10+)
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp libsdcli.so android/app/src/main/jniLibs/arm64-v8a/libsdcli.so
          # Extraer librerias al instalar para poder ejecutar el binario
          GR="$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -n1)"
          printf '\nandroid {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n}\n' >> "$GR"
          grep -n "abiFilters\|ndk" "$GR" || true

      - run: flutter pub get

      - name: Compilar APK (solo arm64)
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: kornels-imagenes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
